<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
      background: url('./terrazo.jpg');
      background-position: center;
    }

    .nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #111;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e90ff, #0057b8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1rem;
      font-weight: bold;
    }

    .menu {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .menu a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .menu a:hover {
      color: #0057b8;
    }

    .hero {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .hero-text {
      flex: 1;
    }

    .hero-text h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #111;
    }

    .hero-text p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #555;
      max-width: 600px;
    }

    .hero-image {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .image-placeholder {
      width: 100%;
      max-width: 500px;
      height: 320px;
      border-radius: 20px;
      background: linear-gradient(135deg, #dfeeff, #b8d6ff);
      border: 1px solid #c7dfff;
    }

    @media (max-width: 768px) {
      .nav {
        flex-direction: column;
        gap: 12px;
      }

      .menu {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero-text h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <div class="logo">
        <div class="logo-box">L</div>
        <span>fliesenmensch</span>
      </div>

      <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Über</a></li>
        <li><a href="#">Kompetenz</a></li>
      </ul>
    </nav>
  </header>

  <main class="hero">
    <div class="hero-text">
      <h1>Wir freuen Sie wilkommen zu heißen.</h1>
      <p>
        Fliesen, Mamor & Steine sind für die Ewigkeit und deswegen bedarf es bei dem Handwerk echte Präzision und vorausschauende Planung bis zur letzten Fuge.
        
      </p>
    </div>

    <div class="hero-image">
      <div class="image-placeholder"></div>
    </div>
  </main>
</body>
</html>
